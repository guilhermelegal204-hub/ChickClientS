plugins {
    id 'net.fabricmc.loom' version '1.7-SNAPSHOT'
    id 'maven-publish'
}

version = '1.21.11'
group = 'net.fabricmc.example'

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.1"
    mappings "net.fabricmc:yarn:1.21.1+build.2:v2"
    modImplementation "net.fabricmc:fabric-loader:0.16.0"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.100.1+1.21"
}
