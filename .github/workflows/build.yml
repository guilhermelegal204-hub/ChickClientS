name: Build Chick Client
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '21'

      - name: Setup Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Clean and Fix Duplicate Paths
        run: |
          if [ -d "ChickClientS" ]; then
            cp -r ChickClientS/src . || true
            rm -f ChickClientS/build.gradle || true
            rm -f ChickClientS/settings.gradle || true
          fi
          mkdir -p src/main/resources
          find src/ -name "fabric.mod.json" -exec cp {} src/main/resources/fabric.mod.json \; 2>/dev/null || true

      - name: Build Mod with Gradle
        run: gradle build --no-daemon

      - name: Upload Compiled Jar
        uses: actions/upload-artifact@v4
        with:
          name: ChickClient-Jar
          path: "**/*.jar"
