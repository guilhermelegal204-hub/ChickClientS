name: Build Chick Client
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '21'

      - name: Clone Fabric Template Base
        run: |
          git clone --depth 1 https://github.com template
          cd template
          # Remove o código de exemplo original
          rm -rf src/main/java/net/fabricmc/example/*
          rm -f src/main/resources/fabric.mod.json
          
          # Move os SEUS arquivos do Chick Client para dentro do template correto
          cp -r ../src . || cp -r ../ChickClientS/src . || true
          
          # Caso o fabric.mod.json esteja em caminhos duplicados, move para o lugar certo
          find src/ -name "fabric.mod.json" -exec cp {} src/main/resources/fabric.mod.json \; 2>/dev/null || true
          
          # Garante que o Gradle do template tenha permissão para rodar
          chmod +x gradlew
          
          # Compila o mod usando a estrutura oficial deles
          ./gradlew build --no-daemon
          
          # Move o arquivo .jar final gerado de volta para o repositório principal
          mkdir -p ../build/libs
          cp build/libs/*.jar ../build/libs/

      - name: Upload Compiled Jar
        uses: actions/upload-artifact@v4
        with:
          name: ChickClient-Jar
          path: build/libs/*.jar
