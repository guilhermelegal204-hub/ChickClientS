name: Build Chick Client
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '21'

      - name: Setup Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Hard Clean and Fix Paths
        run: |
          # 1. Se os códigos estiverem na subpasta, salva eles na raiz primeiro
          if [ -d "ChickClientS/src" ]; then
            cp -r ChickClientS/src . || true
          fi
          
          # 2. DELETA completamente a pasta duplicada inteira e os arquivos fantasmas ocultos nela
          rm -rf ChickClientS || true
          rm -f src/main/java/net/fabricmc/example/src/main/resources/fabric.mod.json || true
          
          # 3. Garante a pasta de recursos correta e limpa para o fabric.mod.json
          mkdir -p src/main/resources
          find src/ -name "fabric.mod.json" -exec cp {} src/main/resources/fabric.mod.json \; 2>/dev/null || true

      - name: Build Mod with Gradle
        run: gradle build --no-daemon

      - name: Upload Compiled Jar
        uses: actions/upload-artifact@v4
        with:
          name: ChickClient-Jar
          path: "**/*.jar"
