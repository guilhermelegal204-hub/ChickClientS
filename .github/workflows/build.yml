name: Build Chick Client
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '21'

      - name: Setup Official Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.10
          chmod +x gradlew

      - name: Fix Internal Duplicate Paths
        run: |
          # Se os arquivos estiverem perdidos em subpastas com o nome do projeto, move para a raiz padrão
          if [ -d "ChickClientS" ]; then
            cp -r ChickClientS/src . || true
          fi
          # Garante que o fabric.mod.json esteja no lugar certo
          mkdir -p src/main/resources
          find src/ -name "fabric.mod.json" -exec cp {} src/main/resources/fabric.mod.json \; 2>/dev/null || true

      - name: Build Mod with Gradle
        run: ./gradlew build --no-daemon

      - name: Upload Compiled Jar
        uses: actions/upload-artifact@v4
        with:
          name: ChickClient-Jar
          path: build/libs/*.jar
