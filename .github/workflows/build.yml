name: Build Chick Client
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '21'

      - name: Create Structure and Compile
        run: |
          # Cria a pasta raiz onde o Gradle trabalha
          mkdir -p src/main/java/net/fabricmc/example
          mkdir -p src/main/resources
          
          # Copia os SEUS arquivos salvos para a pasta raiz padrão do projeto
          cp ChickClientS/src/main/java/net/fabricmc/example/ChickClientPvpMod.java src/main/java/net/fabricmc/example/ || true
          cp ChickClientS/src/main/java/net/fabricmc/example/src/main/resources/fabric.mod.json src/main/resources/ || true
          
          # Baixa o inicializador do Gradle direto da maquina virtual do GitHub
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          
          # Compila o mod de forma limpa
          ./gradlew build --no-daemon

      - name: Upload Compiled Jar
        uses: actions/upload-artifact@v4
        with:
          name: ChickClient-Jar
          path: build/libs/*.jar
