name: Build Chick Client
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '21'

      - name: Build with Clean Template
        run: |
          # 1. Baixa a base oficial do Fabric em uma pasta temporaria chamada 'clean-mod'
          git clone --depth 1 https://github.com clean-mod
          
          # 2. Remove o codigo de exemplo original deles para nao dar conflito
          rm -rf clean-mod/src/main/java/net/fabricmc/example/*
          rm -f clean-mod/src/main/resources/fabric.mod.json
          
          # 3. Procura os SEUS codigos que voce ja criou e joga dentro da estrutura perfeita do Fabric
          find . -name "ChickClientPvpMod.java" -exec cp {} clean-mod/src/main/java/net/fabricmc/example/ \;
          find . -name "fabric.mod.json" -exec cp {} clean-mod/src/main/resources/ \;
          
          # 4. Entra na pasta limpa e roda a compilacao oficial do Fabric
          cd clean-mod
          chmod +x gradlew
          ./gradlew build --no-daemon
          
          # 5. Manda o .jar final de volta para a pasta de uploads do GitHub
          mkdir -p ../build/libs
          cp build/libs/*.jar ../build/libs/ || cp build/libs/*.jar ../build/libs/ || true

      - name: Upload Compiled Jar
        uses: actions/upload-artifact@v4
        with:
          name: ChickClient-Jar
          path: "**/build/libs/*.jar"
